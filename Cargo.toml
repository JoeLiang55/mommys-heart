[package]
name = "mommys-heart-app"
version = "1.1.5"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true }

axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
dotenvy = { version = "0.15", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.37", optional = true }

# Persistence + auth (SSR only).
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "macros",
    "migrate",
    "chrono",
], optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
axum-extra = { version = "0.10", features = ["cookie"], optional = true }
time = { version = "0.3", optional = true }

# Structured logging (SSR only). `tracing` macros emit spans/events; the
# subscriber prints them with timestamps and is filtered via `RUST_LOG`.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
is-terminal = { version = "0.4", optional = true }

gloo-net = { version = "0.6", optional = true }
send_wrapper = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2" }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "File",
    "FileList",
    "FormData",
    "HtmlInputElement",
    "Storage",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
server_fn = { version = "0.8", default-features = false, features = ["multipart"], optional = true }
async-trait = { version = "0.1", optional = true }
infer = { version = "0.19.0", default-features = false, optional = true }
# Generated PDFs (SSR only), e.g. the volunteer agreement download.
printpdf = { version = "0.12", default-features = false, optional = true }
futures = { version = "0.3.32", optional = true }
base64 = { version = "0.22.1", optional = true }
hmac = { version = "0.12", optional = true }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:server_fn",
    "dep:gloo-net",
    "dep:send_wrapper",
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:web-sys",
    "dep:wasm-bindgen-futures",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "dep:reqwest",
    "dep:dotenvy",
    "dep:zip",
    "dep:quick-xml",
    "dep:sqlx",
    "dep:argon2",
    "dep:rand",
    "dep:sha2",
    "dep:hex",
    "dep:chrono",
    "dep:axum-extra",
    "dep:time",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:is-terminal",
    "dep:async-trait",
    "dep:infer",
    "dep:printpdf",
    "dep:futures",
    "dep:base64",
    "dep:hmac",
    "dep:server_fn",

    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

# Silence a false-positive cfg check emitted by the wasm build tooling.
[package.metadata.cargo-all-features]
denylist = ["axum", "tokio", "tower", "tower-http", "leptos_axum", "reqwest", "dotenvy", "zip", "quick-xml", "sqlx", "argon2", "rand", "sha2", "hex", "chrono", "axum-extra", "time", "tracing", "tracing-subscriber", "is-terminal", "async-trait", "infer", "printpdf", "futures", "base64", "hmac"]

[package.metadata.leptos]
output-name = "mommys-heart-app"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false

# Full DWARF exceeds the linker's 4 GiB debug-section relocation limit.
[profile.dev]
debug = 1

[profile.release]
opt-level = "s"
# Fat LTO with a single codegen unit serialises the most expensive phase of the
# build on a 2-vCPU runner. Thin LTO keeps most of the size win and parallelises.
lto = "thin"
codegen-units = 16
